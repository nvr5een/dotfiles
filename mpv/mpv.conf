#
# Safer macOS mpv configuration (tested for option parsing with mpv 0.41.0)

vo=gpu-next
hwdec=auto-safe

# Balanced scaling without the additional cost of mpv's high-quality profile.
# scale/cscale handle luma and chroma upscaling; dscale handles downscaling.
scale=lanczos
cscale=lanczos
dscale=hermite

# Avoid temporal interpolation and extra debanding passes. This keeps GPU load
# predictable and leaves the CRT shaders responsible for the visible texture.
interpolation=no
deband=no

# Limit the initial window to 90% of the current screen while preserving the
# video's aspect ratio. This affects initial window size, not fullscreen mode.
autofit=90%x90%

# Preferred audio-language order: Japanese, Cantonese, Mandarin, Korean,
# French, Spanish, German, then English. Common ISO aliases are included.
alang=jpn,yue,zh-yue,chi,zho,kor,fre,fra,spa,deu,ger,eng

# Prefer English subtitles using both ISO 639-2 and ISO 639-1 codes.
slang=eng,en

# Auto-load external subtitles whose filenames approximately match the video.
sub-auto=fuzzy

# Disable album-art video for audio-only files. This normally prevents mpv
# from opening a video window solely to display cover art.
audio-display=no

# Save incrementally numbered screenshots in ~/Pictures/MPV/. Ensure this
# directory exists; mpv supplies the extension selected by screenshot-format.
screenshot-template=~/Pictures/MPV/mpv-screenshot%n

# Use album ReplayGain when present, falling back to track gain otherwise.
replaygain=album

# Permit the tagged ReplayGain adjustment even if it could clip. Set this to
# no if automatic peak-based clipping prevention is preferred.
replaygain-clip=yes

# Additional gain in decibels applied after ReplayGain selection (0 = neutral).
replaygain-preamp=0

# Playlist profile: use each track's individual gain for more uniform loudness.
# Example: mpv --profile=playlist --playlist=playlist.m3u
[playlist]
replaygain=track

# Every shader profile first clears the active GLSL list. Switching profiles
# therefore replaces the previous look instead of stacking shader chains.
[no-shaders]
glsl-shaders-clr

# Gentle 480-row scanline texture and display-locked aperture grille.
[crt-lite-480p]
glsl-shaders-clr
glsl-shader=~~/shaders/crt-lite-480p-safe.glsl

# Stronger 480p look with normalized chroma bleed and source-space bloom.
[crt-full-480p]
glsl-shaders-clr
glsl-shader=~~/shaders/chroma-bleed-safe.glsl
glsl-shader=~~/shaders/crt-full-480p-safe.glsl

# Finer 720-row CRT texture tuned for 1080p material, with lighter strength.
[crt-lite-1080p]
glsl-shaders-clr
glsl-shader=~~/shaders/crt-lite-1080p-safe.glsl

# Fuller 1080p look: normalized chroma bleed, restrained bloom, and the finer
# 720-row output texture selected during screenshot comparison.
[crt-full-1080p]
glsl-shaders-clr
glsl-shader=~~/shaders/chroma-bleed-safe.glsl
glsl-shader=~~/shaders/crt-full-1080p-safe.glsl
