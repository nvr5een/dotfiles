# =========================
# Core playback and tracks
# =========================

# YouTube-style play/pause toggle.
k cycle pause

# Select the next or previous audio track.
a cycle audio
A cycle audio down

# Select the next or previous subtitle track. Cycling may also select "none".
c cycle sub
C cycle sub down

# Toggle mpv's built-in statistics overlay. While it is open, press 1 for
# general statistics or 2 for frame timings; Esc closes the toggled overlay.
CTRL+i script-binding stats/display-stats-toggle


# ====================
# Seeking / navigation
# ====================

# Seek backward or forward by six seconds.
j seek -6
l seek 6

# Seek backward or forward by one minute.
CTRL+j seek -60
CTRL+l seek 60


# ========================
# Shader profile switching
# ========================

# Each profile clears the current GLSL list before loading its own shaders,
# so switching looks does not stack shader chains. Ctrl+0 clears all shaders.
CTRL+0 apply-profile no-shaders ; show-text "Shaders OFF"
CTRL+6 apply-profile crt-lite-480p  ; show-text "CRT Lite 480p"
CTRL+7 apply-profile crt-full-480p  ; show-text "CRT Full 480p"
CTRL+8 apply-profile crt-lite-1080p ; show-text "CRT Lite 1080p"
CTRL+9 apply-profile crt-full-1080p ; show-text "CRT Full 1080p"


# ==============
# Window scaling
# ==============

# Resize the window to a multiple of the video's displayed size. These affect
# the window, not playback resolution; the OS, available screen area, HiDPI
# behavior, or fullscreen/maximized state may constrain the resulting size.
CTRL+1 set window-scale 1 ; show-text "Window 1x"
CTRL+2 set window-scale 2 ; show-text "Window 2x"
CTRL+3 set window-scale 3 ; show-text "Window 3x"

# A 4x window can exceed the screen and substantially increase GPU work when
# output-stage CRT shaders are active.
# CTRL+4 set window-scale 4 ; show-text "Window 4x (high load)"
